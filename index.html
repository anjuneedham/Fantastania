<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Fantastania — Realm of Aetheria</title>
  <meta name="description" content="A 2D fantasy action-RPG set in the Realm of Aetheria." />
  <!--
    viewport-fit=cover lets the canvas run under notches; the CSS below converts
    the resulting safe-area insets into custom properties the renderer reads.
    user-scalable=no is deliberate: pinch-zoom on an action game is a bug.
  -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#070912" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="color-scheme" content="dark" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
  <style>
    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --aether: #5fe6d0;
      --void: #070912;
      --dusk: #161b3a;
      --bone: #e8e3d3;
      color-scheme: dark;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #070912;
      color: var(--bone);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      /* Kill every browser gesture that would fight the game's own input. */
      overscroll-behavior: none;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }

    #app {
      position: fixed;
      inset: 0;
      display: block;
    }

    #game-canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      /* The canvas already letterboxes internally; this is just the backdrop. */
      background: #05060c;
    }

    /* DOM overlay for menu panels. Pointer-events are enabled per panel so the
       canvas keeps receiving input while nothing is open. */
    #ui-root {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      display: flex;
      flex-direction: column;
    }

    /* ---------------- Loading screen ---------------- */
    #boot {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 26px;
      background:
        radial-gradient(120% 90% at 50% 18%, #1b2150 0%, #0b0e22 45%, #05060c 100%);
      transition: opacity 0.6s ease;
    }
    #boot.done { opacity: 0; pointer-events: none; }

    #boot-mark {
      width: 116px;
      height: 116px;
      animation: bootPulse 2.4s ease-in-out infinite;
    }
    @keyframes bootPulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 14px rgba(95,230,208,0.35)); }
      50%      { transform: scale(1.05); filter: drop-shadow(0 0 26px rgba(95,230,208,0.6)); }
    }

    #boot-title {
      font-family: "Trebuchet MS", "Gill Sans", system-ui, sans-serif;
      font-size: clamp(28px, 7vw, 48px);
      font-weight: 800;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      margin: 0;
      color: #e8e3d3;
      text-shadow: 0 0 22px rgba(95, 230, 208, 0.35);
    }
    #boot-sub {
      margin: -16px 0 0;
      font-size: clamp(11px, 2.6vw, 14px);
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: #5a6699;
    }

    #boot-bar {
      width: min(320px, 62vw);
      height: 4px;
      border-radius: 4px;
      background: rgba(90, 102, 153, 0.25);
      overflow: hidden;
    }
    #boot-fill {
      height: 100%;
      width: 12%;
      border-radius: 4px;
      background: linear-gradient(90deg, #2a8f86, #5fe6d0);
      transition: width 0.35s ease;
    }
    #boot-status {
      margin: 0;
      font-size: 12px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #5a6699;
      min-height: 15px;
    }

    #boot-error {
      max-width: min(560px, 86vw);
      font-size: 13px;
      line-height: 1.6;
      color: #e0455e;
      text-align: center;
      white-space: pre-wrap;
    }

    /* Portrait nudge: the game is designed for landscape, so say so plainly
       rather than squeezing the HUD into a shape it was not built for. */
    #rotate-hint {
      position: fixed;
      inset: 0;
      z-index: 90;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 24px;
      text-align: center;
      background: #070912;
    }
    #rotate-hint p {
      margin: 0;
      font-size: 15px;
      letter-spacing: 0.08em;
      color: #b3ae9c;
      max-width: 30ch;
      line-height: 1.6;
    }
    #rotate-hint .glyph {
      font-size: 54px;
      animation: rotateNudge 2.2s ease-in-out infinite;
    }
    @keyframes rotateNudge {
      0%, 45%   { transform: rotate(0deg); }
      60%, 100% { transform: rotate(-90deg); }
    }
    /* Only nag on genuinely small portrait screens — a portrait tablet or a tall
       desktop window is perfectly playable. */
    @media (orientation: portrait) and (max-width: 820px) {
      body.needs-landscape #rotate-hint { display: flex; }
    }
  </style>
</head>
<body>
  <div id="app">
    <canvas id="game-canvas"></canvas>
  </div>
  <div id="ui-root"></div>

  <div id="rotate-hint">
    <div class="glyph">📱</div>
    <p>Fantastania is played in landscape. Turn your device sideways to begin.</p>
  </div>

  <div id="boot">
    <svg id="boot-mark" viewBox="0 0 100 100" aria-hidden="true">
      <!-- The aether shard: the game's mark, drawn rather than loaded. -->
      <defs>
        <linearGradient id="shardGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#9df5e6" />
          <stop offset="55%" stop-color="#5fe6d0" />
          <stop offset="100%" stop-color="#2a8f86" />
        </linearGradient>
      </defs>
      <circle cx="50" cy="50" r="38" fill="none" stroke="#3b4576" stroke-width="1.5" opacity="0.7" />
      <circle cx="50" cy="50" r="46" fill="none" stroke="#232a52" stroke-width="1" opacity="0.6" />
      <path d="M50 12 L68 42 L50 88 L32 42 Z" fill="url(#shardGrad)" />
      <path d="M50 12 L68 42 L50 50 Z" fill="#c9fff4" opacity="0.55" />
      <path d="M32 42 L68 42" stroke="#070912" stroke-width="1.6" opacity="0.5" />
    </svg>
    <h1 id="boot-title">Fantastania</h1>
    <p id="boot-sub">Realm of Aetheria</p>
    <div id="boot-bar"><div id="boot-fill"></div></div>
    <p id="boot-status">Waking the aether…</p>
    <div id="boot-error" hidden></div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
